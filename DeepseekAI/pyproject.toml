[build-system]
requires = ["setuptools"]

[project]
name = "limnoria-deepseekai"
version = "0.0.0"
authors = [
    { name = "Stathis Xantinidis" }
]
readme = "README.md"
dependencies = [
    "limnoria",
    "httpx>=0.27,<1",
]
classifiers = [
    'Environment :: Plugins',
    'Programming Language :: Python :: 3',
    'Topic :: Communications :: Chat',
]

[project.entry-points.'limnoria.plugins']
DeepseekAI = "limnoria_deepseekai"

[tool.setuptools.package-dir]
"limnoria_deepseekai" = "."
"limnoria_deepseekai.local" = "local/"

[tool.setuptools.package-data]
"limnoria_deepseekai" = ["locales/*.po"]
